# Include INSIDE the existing HTTPS VirtualHost for wingman.rogiermaas.nl.
# Keep the existing certificate configuration. Requires proxy, proxy_http and proxy_wstunnel.
# Explicit ws mapping works with AlmaLinux 8's older Apache 2.4 as well.
ProxyRequests Off
ProxyPreserveHost On
ProxyPass        "/v1/session" "ws://127.0.0.1:8787/v1/session" timeout=30
ProxyPassReverse "/v1/session" "ws://127.0.0.1:8787/v1/session"
ProxyPass        "/v1/" "http://127.0.0.1:8787/v1/" timeout=30
ProxyPassReverse "/v1/" "http://127.0.0.1:8787/v1/"
ProxyPass        "/healthz" "http://127.0.0.1:8787/healthz" timeout=5
ProxyPassReverse "/healthz" "http://127.0.0.1:8787/healthz"
# Apache serves downloads directly, outside the telemetry WebSocket.
Alias "/releases/" "/opt/wingman/releases/"
<Directory "/opt/wingman/releases">
    Options -Indexes
    AllowOverride None
    Require all granted
    <Files "*.json">
        Require all denied
    </Files>
</Directory>
DocumentRoot "/var/www/wingman"
<Directory "/var/www/wingman">
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>
